# ==============================================================================
# CONFIGURAÇÃO DE PERSISTÊNCIA DE DADOS (SQLite + JPA/Hibernate)
# Referência teórica: Unidade "Persistência de Dados" (JDBC, SGBD e ORM Hibernate)
# ==============================================================================

# Porta padrão do servidor web embutido (Tomcat)
server.port=8080

# String de conexão JDBC: cria o arquivo "streaming.db" na raiz do projeto automaticamente
spring.datasource.url=jdbc:sqlite:streaming.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# O SQLite trabalha com bloqueio no arquivo único; limitamos o pool a 1 conexão simultânea
# para evitar o erro "SQLITE_BUSY (database is locked)" durante a aula de laboratório
spring.datasource.hikari.maximum-pool-size=1

# Dialeto que ensina o ORM Hibernate a gerar comandos SQL compatíveis com o SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# "update": O Hibernate cria ou atualiza as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Exibe no console os comandos SQL gerados pelo Hibernate (excelente para demonstrar em aula!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

